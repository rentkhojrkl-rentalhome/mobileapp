
name: rentkhoj_mobile
description: "RentKhojRKL Android rental marketplace."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # API communication
  http: ^1.2.2

  # Secure JWT token storage
  flutter_secure_storage: ^9.2.4

  # Profile and property image selection
  image_picker: ^1.2.4
  http_parser: ^4.1.2
  path: ^1.9.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
